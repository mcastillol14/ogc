spring.application.name=ogc

# DataSource (valores desde .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Colores en consola
spring.output.ansi.enabled=ALWAYS

# Nivel de log más útil durante desarrollo
logging.level.root=INFO
logging.level.com.ogc_prototype=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

rate.limit.capacity=60
rate.limit.window-seconds=60
rate.limit.cleanup-delay-ms=120000

job.thread-pool.core-size=2
job.thread-pool.max-size=4

# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Verificacion de email
verification.code.expiry-minutes=15